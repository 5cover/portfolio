synopsis:
  en: The LLCE-Anglais Monde Contemporain (AMC) specialized teaching aims to
    analyze some major social, economic, political, geopolitical, cultural,
    scientific, and technical issues of the contemporary english-speaking world.
  fr: La spécialité LLCER Licence de langues, littératures et civilisations
    étrangères et régionales – Anglais Monde Contemporain (AMC) se donne
    pour objectif d'analyser quelques grands enjeux sociaux, économiques,
    politiques, géopolitiques, culturels, scientifiques et techniques du monde
    anglophone contemporain.
