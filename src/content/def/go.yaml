type: programming-language
name:
  full: Golang
  short: Go
synopsis:
  en:
    - 'Go is a statically typed, compiled high-level programming language designed at Google by Robert Griesemer, Rob Pike, and Ken Thompson in '
    - time: '2009'
    - '. It is syntactically similar to C, but also has memory safety, garbage collection, structural typing and CSP-style concurrency.'
  fr:
    - 'Langage de programmation open source créé par Google en '
    - time: '2009'
    - '. Il a été conçu par Robert Griesemer, Rob Pike et Ken Thompson pour améliorer la productivité des développeurs lors de la création de logiciels fiables et efficaces.'
