type: person
name:
  full: Paolo Vito Toé
  short: Paolo Toé
synopsis:
  en: Paolo Vito Toé is a student in BUT Informatique at the IUT of Lannion. His
    path pushes him to constantly improve, because IT is one of his great
    passions. Born in the United States and raised in several different
    countries, he is also passionate about foreign cultures. In addition to his
    studies, he is passionate about reading and creating games.
  fr: Paolo Vito Toé est un étudiant en BUT Informatique à l'IUT de Lannion. Son
    parcours le pousse à s'améliorer en permanence, car l'informatique est une
    de ses grandes passions. Né aux États-Unis et ayant grandi dans plusieurs
    pays différents, il est suis aussi passionné par les cultures étrangères.
    Outre ses études, il est passionné par la lecture et la création de jeux.
